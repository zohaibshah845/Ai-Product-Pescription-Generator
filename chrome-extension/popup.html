<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Product Description Generator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <h1>AI Description Generator</h1>
      <button id="settingsBtn" class="icon-btn">⚙️</button>
    </div>

    <div class="form-group">
      <label for="productName">Product Name *</label>
      <input type="text" id="productName" placeholder="Enter product name">
    </div>

    <div class="form-group">
      <label for="productFeatures">Features * (comma-separated)</label>
      <textarea id="productFeatures" rows="3" placeholder="Waterproof, 4K Resolution, Bluetooth 5.0"></textarea>
    </div>

    <div class="form-group">
      <label for="tone">Tone</label>
      <select id="tone">
        <option value="professional">Professional</option>
        <option value="casual">Casual</option>
        <option value="luxury">Luxury</option>
        <option value="friendly">Friendly</option>
        <option value="technical">Technical</option>
        <option value="enthusiastic">Enthusiastic</option>
        <option value="minimalist">Minimalist</option>
      </select>
    </div>

    <button id="generateBtn" class="generate-btn">
      Generate Description
    </button>

    <div id="loading" class="loading" style="display: none;">
      <div class="spinner"></div>
      <p>Generating...</p>
    </div>

    <div id="error" class="error" style="display: none;"></div>

    <div id="result" class="result" style="display: none;">
      <h2 id="title"></h2>
      
      <div class="section">
        <h3>Short Description</h3>
        <p id="shortDesc"></p>
        <button class="copy-btn" data-target="shortDesc">Copy</button>
      </div>

      <div class="section">
        <h3>Long Description</h3>
        <p id="longDesc"></p>
        <button class="copy-btn" data-target="longDesc">Copy</button>
      </div>

      <div class="section">
        <h3>Key Features</h3>
        <ul id="bulletPoints"></ul>
        <button class="copy-btn" data-target="bulletPoints">Copy All</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
